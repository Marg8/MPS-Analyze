services:
  mps-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: mps-capacity-scheduler:latest
    container_name: mps-scheduler
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    # Business data kept OUT of the image and mounted read-only at runtime.
    # Comment these out if you prefer users to upload files via the UI only.
    volumes:
      - ./MPS.xlsx:/app/MPS.xlsx:ro
      - ./Excel.xlsx:/app/Excel.xlsx:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    # Sensible resource ceilings for a shared server (tune to your host).
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    security_opt:
      - no-new-privileges:true
